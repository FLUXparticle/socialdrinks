<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Bar bearbeiten</title>
</head>
<body>

<!-- Einbindung der zentralen Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Bar bearbeiten</h1>

<form th:action="@{/bars/{id}(id=${bar.id})}" th:object="${bar}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:field="*{version}"/>

    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required/>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    <br/>

    <label for="email">E-Mail:</label>
    <input type="email" id="email" th:field="*{email}" required/>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    <br/>

    <label for="address">Adresse:</label>
    <textarea id="address" th:field="*{address}"></textarea>
    <br/>

    <button type="submit">Speichern</button>
    <a href="/bars">Abbrechen</a>
</form>
</body>
</html>

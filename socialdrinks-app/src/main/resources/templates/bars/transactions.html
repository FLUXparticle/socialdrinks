<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Transaktionen für <span th:text="${bar.name}">Bar</span></title>
</head>
<body>

<!-- Einbindung der zentralen Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Transaktionen für <span th:text="${bar.name}"></span></h1>

<a href="/bars">Zurück zur Bars-Liste</a>

<table border="1">
    <thead>
    <tr>
        <th>Aktion</th>
        <th>Details</th>
        <th>Zeitstempel</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.action}"></td>
        <td th:text="${transaction.details}"></td>
        <td th:text="${#dates.format(transaction.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>

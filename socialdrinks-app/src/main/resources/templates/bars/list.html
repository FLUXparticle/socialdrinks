<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Bars List</title>
</head>
<body>

<!-- Einbindung der zentralen Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Bars</h1>

<a href="/bars/new">Neue Bar hinzufügen</a>

<table border="1">
    <thead>
    <tr>
        <th>Name</th>
        <th>E-Mail</th>
        <th>Adresse</th>
        <th>Aktionen</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bar : ${bars}">
        <td th:text="${bar.name}"></td>
        <td th:text="${bar.email}"></td>
        <td th:text="${bar.address}"></td>
        <td>
            <a th:href="@{/bars/{id}/edit(id=${bar.id})}">Bearbeiten</a> |
            <a th:href="@{/bars/{id}/transactions(id=${bar.id})}">Transaktionen</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Good App - Admin</title>
    <link rel="stylesheet" href="/css/good.css">
</head>
<body>
<h1>Good App – Admin View</h1>

<section id="login-section">
    <h2>Login</h2>
    <form id="login-form">
        <label>
            Username:
            <input type="text" id="username" value="admin" required>
        </label>
        <br>
        <label>
            Password:
            <input type="password" id="password" value="Secret123" required>
        </label>
        <br>
        <button type="submit">Login</button>
    </form>
    <p id="login-status"></p>
</section>

<section id="overview-section" class="hidden">
    <h2>User Notes</h2>
    <button id="refresh-button">Refresh Notes</button>
    <div id="notes-output"></div>
</section>

<script src="/js/good-admin.js"></script>
</body>
</html>
